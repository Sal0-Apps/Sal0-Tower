name: sal0-tower
services:
  app:
    container_name: sal0-tower
    image: ghcr.io/sal0-apps/sal0-tower:latest
    network_mode: host
    restart: unless-stopped
    init: true
    privileged: false
    security_opt:
      - no-new-privileges:true
    cpus: 1
    mem_limit: 256M
    mem_reservation: 32M
    pids_limit: 64
    environment:
      TZ: America/Sao_Paulo
      SAL0_PORT: "7890"
      SAL0_HOST_NETWORK: "true"
      SAL0_DATA: /data
      SAL0_ZIMA_APPS: /zima-apps
      WATCHTOWER_CONTAINER: watchtower
    volumes:
      - /DATA/AppData/sal0-tower/data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/casaos/apps:/zima-apps:ro
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      icon: https://raw.githubusercontent.com/Sal0-Apps/Sal0-Tower/main/assets/icon-512.png
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
x-casaos:
  architectures: [amd64, arm64]
  author: Sal0 Apps
  developer: Sal0 Apps
  category: Utilities
  main: app
  port_map: "7890"
  scheme: http
  index: /
  icon: https://raw.githubusercontent.com/Sal0-Apps/Sal0-Tower/main/assets/icon-512.png
  title:
    custom: Sal0 Tower
    en_us: Sal0 Tower
    pt_br: Sal0 Tower
  tagline:
    pt_br: Atualizações do seu servidor sob controle.
    en_us: Keep your server updates under control.
  description:
    pt_br: Interface para o Watchtower existente, com containers, filtros, atualização manual, agendamento e registros. Preserva as notificações e mantém o motor independente.
    en_us: Web panel for an existing Watchtower with filters, scheduling, manual updates and logs.
  version: "1.1.0"
  store_app_id: sal0-tower
