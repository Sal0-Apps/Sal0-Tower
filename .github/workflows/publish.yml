name: Test and publish Sal0 Tower
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sal0-tower-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Unit and HTTP integration tests
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install -r requirements.txt
          .ci-venv/bin/python -m unittest discover -s tests -v
      - name: JavaScript and compose syntax
        run: |
          node --check panel/static/app.js
          docker compose config -q
      - name: Browser workflow and mobile layout
        timeout-minutes: 8
        run: |
          .ci-venv/bin/pip install playwright
          if ! command -v google-chrome; then
            .ci-venv/bin/python -m playwright install --with-deps chromium
          fi
          timeout 180 .ci-venv/bin/python -u tests/browser_smoke.py
      - name: Build panel for Docker integration
        run: docker build -t sal0-tower:ci .
      - name: Test with independent Docker engine
        run: sudo python3 tests/docker_smoke.py
  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/sal0-apps/sal0-tower:latest
            ghcr.io/sal0-apps/sal0-tower:1.1.0
            ghcr.io/sal0-apps/sal0-tower:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  verify-public-image:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Verify image can be downloaded without credentials
        run: docker manifest inspect ghcr.io/sal0-apps/sal0-tower:latest
